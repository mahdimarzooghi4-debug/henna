appId: ${APP_ID}
---
# A fresh iOS simulator asks once before opening a registered custom scheme.
# Accept only that system trust prompt and prove that the installed app opens.
# Subsequent smoke flows terminate the app again before their real cold URLs.
- openLink: "hana://browse"
- extendedWaitUntil:
    visible: "^Open$"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: 'Open in .*حنا.*'
    commands:
      - tapOn:
          text: "^Open$"
- extendedWaitUntil:
    visible: "کالاها را در حنا مرور کنید"
    timeout: 120000
- assertVisible: "کالاها را در حنا مرور کنید"

appId: ${APP_ID}
---
# Fresh app is force-stopped by the shell before the XCTest driver starts.
- openLink: "hana://browse?search=%DA%A9%D8%A7%D9%84%D8%A7%DB%8C+%D9%BE%DB%8C%D9%88%D9%86%D8%AF+%D8%A2%D8%B2%D9%85%D8%A7%DB%8C%D8%B4%DB%8C&page=2"
- runFlow:
    when:
      visible: 'Open in .*حنا.*'
    commands:
      - tapOn: "Open"
# Cold startup on macOS CI can take longer than a standard assertion retry.
# Proceed only after the real React Native browse screen appears.
- extendedWaitUntil:
    visible: "کالاها را در حنا مرور کنید"
    timeout: 120000
- assertVisible: "کالاها را در حنا مرور کنید"
- assertVisible: "کالای پیوند آزمایشی"
- assertVisible: "دریافت کالاها تأیید نشد"

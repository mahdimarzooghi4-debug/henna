appId: ${APP_ID}
---
# Fresh app is force-stopped by the shell before the XCTest driver starts.
- openLink: "hana://browse?search=%DA%A9%D8%A7%D9%84%D8%A7%DB%8C+%D9%BE%DB%8C%D9%88%D9%86%D8%AF+%D8%A2%D8%B2%D9%85%D8%A7%DB%8C%D8%B4%DB%8C&page=2"
# Match the actual iOS Open button, not the parent 'Open in “حنا”?' title.
# On an already trusted simulator the system prompt is absent, so this
# bounded wait is optional; the buyer-screen assertion below is mandatory.
- extendedWaitUntil:
    visible: "^Open$"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: 'Open in .*حنا.*'
    commands:
      - tapOn:
          text: "^Open$"
# Keep the already-delivered cold link, but explicitly bring the target app
# back in front of SpringBoard before reading its native accessibility tree.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "کالاها را در حنا مرور کنید"
    timeout: 120000
- assertVisible: "کالاها را در حنا مرور کنید"
- assertVisible: "کالای پیوند آزمایشی"
- assertVisible: "دریافت کالاها تأیید نشد"
# Public commerce shells must also be reachable in the installed app without
# inventing a login or server response. Their honest no-API error state is
# required, matching the Android installed-app gate.
- tapOn: "سبد خرید"
- extendedWaitUntil:
    visible: "سبد مرجع خرید"
    timeout: 60000
- assertVisible: "پاسخ سرور تأیید نشد"
- tapOn: "مقایسه فروشگاه‌ها و ادامه خرید"
- extendedWaitUntil:
    visible: "مقایسهٔ پیشنهادها"
    timeout: 60000
- assertVisible: "پاسخ سرور تأیید نشد"
- tapOn: "بازگشت"
- assertVisible: "سبد مرجع خرید"
- tapOn: "بازگشت"
- assertVisible: "کالاها را در حنا مرور کنید"
- tapOn: "سفارش‌های من"
- extendedWaitUntil:
    visible: "سفارش‌های من"
    timeout: 60000
- assertVisible: "پاسخ سرور تأیید نشد"
- tapOn: "بازگشت"
- assertVisible: "کالاها را در حنا مرور کنید"
- tapOn: "گزارش‌ها و مرجوعی‌های من"
- extendedWaitUntil:
    visible: "گزارش‌ها و مرجوعی‌های من"
    timeout: 60000
- assertVisible: "پاسخ سرور تأیید نشد"
- tapOn: "بازگشت"
- assertVisible: "کالاها را در حنا مرور کنید"

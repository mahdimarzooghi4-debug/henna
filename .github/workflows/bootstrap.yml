name: Bootstrap checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Ephemeral CI-only credential. Never reuse in any deployment.
      ConnectionStrings__IdentityDb: Host=localhost;Port=5432;Database=hana_ci;Username=hana_ci;Password=hana_ci_only
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hana_ci
          POSTGRES_USER: hana_ci
          POSTGRES_PASSWORD: hana_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hana_ci -d hana_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore .NET solution
        run: dotnet restore Hana.slnx
      - name: Build .NET solution
        run: dotnet build Hana.slnx --configuration Release --no-restore
      - name: Verify Catalog migration snapshot matches model
        run: dotnet test Hana.slnx --configuration Release --no-build --filter FullyQualifiedName~CatalogModelSnapshotTests
      - name: Apply Identity, Seller and Catalog migrations
        run: dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --apply-migrations
      - name: Confirm repeated migration is harmless
        run: dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --apply-migrations
      - name: Test Identity, Seller and Catalog domain, API and PostgreSQL schemas
        run: dotnet test Hana.slnx --configuration Release --no-build
      - name: Smoke test liveness and bootstrap endpoint
        shell: bash
        run: |
          set -euo pipefail
          ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:5184 dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile > /tmp/hana-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5184/health/live > /dev/null; then
              curl --fail --silent http://127.0.0.1:5184/api/v1/system/status | grep -q '"phase":"bootstrap"'
              curl --fail --silent http://127.0.0.1:5184/health/ready | grep -q '"ready":true'
              curl --fail --silent http://127.0.0.1:5184/api/v1/catalog/categories -o /tmp/hana-catalog-categories.json
              grep -q '"items":' /tmp/hana-catalog-categories.json
              curl --fail --silent http://127.0.0.1:5184/api/v1/catalog/products -o /tmp/hana-catalog-products.json
              grep -q '"pageSize":20' /tmp/hana-catalog-products.json
              catalog_bad=$(curl --silent --output /tmp/hana-catalog-invalid.json --write-out "%{http_code}" 'http://127.0.0.1:5184/api/v1/catalog/products?pageSize=100')
              test "$catalog_bad" = "400"
              status_invalid=$(curl --silent --output /tmp/hana-invalid.json --write-out "%{http_code}" -H "Content-Type: application/json" -d '{"phone":"123"}' http://127.0.0.1:5184/api/v1/auth/otp/request)
              test "$status_invalid" = "400"
              status_no_provider=$(curl --silent --output /tmp/hana-no-provider.json --write-out "%{http_code}" -H "Content-Type: application/json" -d '{"phone":"09123456789"}' http://127.0.0.1:5184/api/v1/auth/otp/request)
              test "$status_no_provider" = "503"
              verify_invalid=$(curl --silent --output /tmp/hana-verify-invalid.json --write-out "%{http_code}" -H "Content-Type: application/json" -d '{"challengeId":"00000000-0000-0000-0000-000000000000","phone":"123","code":"abc"}' http://127.0.0.1:5184/api/v1/auth/otp/verify)
              test "$verify_invalid" = "400"
              verify_unavailable=$(curl --silent --output /tmp/hana-verify-unavailable.json --write-out "%{http_code}" -H "Content-Type: application/json" -d '{"challengeId":"00000000-0000-0000-0000-000000000001","phone":"09123456789","code":"123456"}' http://127.0.0.1:5184/api/v1/auth/otp/verify)
              test "$verify_unavailable" = "503"
              # No valid session is ever created by the default disabled SMS provider.
              session_no_bearer=$(curl --silent --output /tmp/hana-session-missing.json --write-out "%{http_code}" http://127.0.0.1:5184/api/v1/auth/session)
              test "$session_no_bearer" = "401"
              session_missing_db_token=$(curl --silent --output /tmp/hana-session-invalid.json --write-out "%{http_code}" -H "Authorization: Bearer hn1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" http://127.0.0.1:5184/api/v1/auth/session)
              test "$session_missing_db_token" = "401"
              logout_no_bearer=$(curl --silent --output /tmp/hana-logout-missing.json --write-out "%{http_code}" -X DELETE http://127.0.0.1:5184/api/v1/auth/session)
              test "$logout_no_bearer" = "401"
              logout_invalid=$(curl --silent --output /tmp/hana-logout-invalid.json --write-out "%{http_code}" -X DELETE -H "Authorization: Bearer hn1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" http://127.0.0.1:5184/api/v1/auth/session)
              test "$logout_invalid" = "401"
              # Seller draft endpoints never accept anonymous submissions.
              seller_get=$(curl --silent --output /tmp/hana-seller-get.json --write-out "%{http_code}" http://127.0.0.1:5184/api/v1/seller/registration)
              test "$seller_get" = "401"
              seller_put=$(curl --silent --output /tmp/hana-seller-put.json --write-out "%{http_code}" -X PUT -H "Content-Type: application/json" -d '{"storeName":"نمونه","ownerName":"مسئول","phone":"09123456789","city":"تهران","address":"نشانی","postalCode":"1234567890"}' http://127.0.0.1:5184/api/v1/seller/registration)
              test "$seller_put" = "401"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hana-api.log
          exit 1

      - name: Smoke test explicit trusted proxy handling
        shell: bash
        run: |
          set -euo pipefail

          # Production must ignore spoofed forwarding headers when the direct peer
          # is NOT in the explicit trust list.
          ASPNETCORE_ENVIRONMENT=Production \
          ASPNETCORE_URLS=http://127.0.0.1:5185 \
          ReverseProxy__Enabled=true \
          ReverseProxy__TrustedAddresses=192.0.2.10 \
          dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile > /tmp/hana-proxy-untrusted.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5185/health/live > /dev/null; then
              status=$(curl --silent --output /tmp/hana-proxy-untrusted.json --write-out "%{http_code}" \
                -H "X-Forwarded-For: 203.0.113.25" \
                -H "X-Forwarded-Proto: https" \
                -H "Authorization: Bearer hn1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" \
                http://127.0.0.1:5185/api/v1/auth/session)
              test "$status" = "503"
              break
            fi
            sleep 1
          done
          kill "$api_pid" 2>/dev/null || true
          wait "$api_pid" 2>/dev/null || true
          trap - EXIT

          # A specifically trusted loopback proxy may supply original HTTPS/IP.
          ASPNETCORE_ENVIRONMENT=Production \
          ASPNETCORE_URLS=http://127.0.0.1:5186 \
          ReverseProxy__Enabled=true \
          ReverseProxy__TrustedAddresses=127.0.0.1 \
          dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile > /tmp/hana-proxy-trusted.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5186/health/live > /dev/null; then
              status=$(curl --silent --output /tmp/hana-proxy-trusted.json --write-out "%{http_code}" \
                -H "X-Forwarded-For: 203.0.113.25" \
                -H "X-Forwarded-Proto: https" \
                -H "Authorization: Bearer hn1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" \
                http://127.0.0.1:5186/api/v1/auth/session)
              test "$status" = "401"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hana-proxy-trusted.log
          exit 1

      - name: Reject unsafe or incomplete forwarded-header configuration
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ASPNETCORE_ENVIRONMENT=Production \
          ASPNETCORE_URLS=http://127.0.0.1:5187 \
          ReverseProxy__Enabled=true \
          dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile > /tmp/hana-proxy-invalid.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "ReverseProxy:TrustedAddresses" /tmp/hana-proxy-invalid.log

          set +e
          ASPNETCORE_FORWARDEDHEADERS_ENABLED=true \
          ASPNETCORE_ENVIRONMENT=Production \
          ASPNETCORE_URLS=http://127.0.0.1:5188 \
          dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile > /tmp/hana-proxy-unsafe-switch.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "ASPNETCORE_FORWARDEDHEADERS_ENABLED=true is not allowed" /tmp/hana-proxy-unsafe-switch.log

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck web
        run: npm run web:typecheck
      - name: Build web
        run: npm run web:build
      - name: Smoke test Figma routes and exported logo
        shell: bash
        run: |
          set -euo pipefail
          npm run start --workspace @hana/web-marketplace > /tmp/hana-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/auth -o /tmp/hana-auth.html; then
              curl --fail --silent http://127.0.0.1:3000/seller/register -o /tmp/hana-seller.html
              curl --fail --silent http://127.0.0.1:3000/hana-logo.png -o /tmp/hana-logo.png
              grep -q 'ورود به حنا' /tmp/hana-auth.html
              grep -q 'ثبت‌نام فروشگاه در حنا' /tmp/hana-seller.html
              test -s /tmp/hana-logo.png
              # Route mutations need an exact same-origin Origin header.
              auth_proxy_status=$(curl --silent --output /tmp/hana-auth-proxy.json --write-out "%{http_code}" -H "Content-Type: application/json" -H "Origin: http://127.0.0.1:3000" -d '{"phone":"09123456789"}' http://127.0.0.1:3000/api/auth/otp/request)
              echo "CI WEB auth_proxy_status=$auth_proxy_status"
              test "$auth_proxy_status" = "503"
              auth_csrf=$(curl --silent --output /tmp/hana-auth-csrf.json --write-out "%{http_code}" -H "Content-Type: application/json" -H "Origin: https://malicious.test" -d '{"phone":"09123456789"}' http://127.0.0.1:3000/api/auth/otp/request)
              echo "CI WEB auth_csrf=$auth_csrf"
              test "$auth_csrf" = "403"
              verify_no_provider=$(curl --silent --output /tmp/hana-verify-no-provider.json --write-out "%{http_code}" -H "Content-Type: application/json" -H "Origin: http://127.0.0.1:3000" -d '{"phone":"09123456789","code":"123456","challengeId":"6b2bc828-cf5d-4af7-a026-a653739d8509"}' http://127.0.0.1:3000/api/auth/otp/verify)
              echo "CI WEB verify_no_provider=$verify_no_provider"
              test "$verify_no_provider" = "503"
              session_no_cookie=$(curl --silent --output /tmp/hana-web-session.json --write-out "%{http_code}" http://127.0.0.1:3000/api/auth/session)
              echo "CI WEB session_no_cookie=$session_no_cookie"
              test "$session_no_cookie" = "401"
              logout_wrong_origin=$(curl --silent --output /tmp/hana-web-logout.json --write-out "%{http_code}" -X DELETE -H "Origin: https://malicious.test" http://127.0.0.1:3000/api/auth/session)
              echo "CI WEB logout_wrong_origin=$logout_wrong_origin"
              test "$logout_wrong_origin" = "403"
              seller_csrf=$(curl --silent --output /tmp/hana-seller-csrf.json --write-out "%{http_code}" -X PUT -H "Content-Type: application/json" -H "Origin: https://malicious.test" -d '{}' http://127.0.0.1:3000/api/seller/registration)
              test "$seller_csrf" = "403"
              seller_anonymous=$(curl --silent --output /tmp/hana-seller-anonymous.json --write-out "%{http_code}" -X PUT -H "Content-Type: application/json" -H "Origin: http://127.0.0.1:3000" -d '{}' http://127.0.0.1:3000/api/seller/registration)
              test "$seller_anonymous" = "401"
              seller_anonymous_get=$(curl --silent --output /tmp/hana-seller-anonymous-get.json --write-out "%{http_code}" http://127.0.0.1:3000/api/seller/registration)
              test "$seller_anonymous_get" = "401"
              # Without the required HTTPS upstream configuration, public
              # catalog gateway must fail closed, not show an empty catalog.
              for route in categories products products/123e4567-e89b-42d3-a456-426614174000; do
                result=$(curl --silent --output /tmp/hana-catalog-web.json --write-out "%{http_code}" "http://127.0.0.1:3000/api/catalog/$route")
                test "$result" = "503"
              done
              catalog_invalid=$(curl --silent --output /tmp/hana-catalog-invalid-web.json --write-out "%{http_code}" 'http://127.0.0.1:3000/api/catalog/products?pageSize=51')
              test "$catalog_invalid" = "400"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hana-web.log
          exit 1
      - name: Test isolated web cookie gateway (CI-only mock upstream)
        run: node tests/web-auth-gateway-smoke.mjs

  mobile:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install monorepo dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo compatibility
        run: npx expo install --check
        working-directory: apps/mobile-consumer
      - name: Typecheck consumer app
        run: npm run mobile:typecheck
      - name: Test mobile OTP and SecureStore session semantics (CI-only mocked API/store)
        run: node --experimental-strip-types --test tests/mobile-auth-smoke.mjs
      - name: Bundle consumer app for Android
        run: npm run mobile:export:android

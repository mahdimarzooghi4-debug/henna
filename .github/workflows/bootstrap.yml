name: Bootstrap checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Ephemeral CI-only credential. Never reuse in any deployment.
      ConnectionStrings__IdentityDb: Host=localhost;Port=5432;Database=hana_ci;Username=hana_ci;Password=hana_ci_only
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hana_ci
          POSTGRES_USER: hana_ci
          POSTGRES_PASSWORD: hana_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hana_ci -d hana_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore .NET solution
        run: dotnet restore Hana.slnx
      - name: Build .NET solution
        run: dotnet build Hana.slnx --configuration Release --no-restore
      - name: Verify Catalog migration snapshot matches model
        run: dotnet test Hana.slnx --configuration Release --no-build --filter FullyQualifiedName~CatalogModelSnapshotTests
      - name: Verify Geography migration snapshot matches model
        run: dotnet test Hana.slnx --configuration Release --no-build --filter FullyQualifiedName~GeographyModelSnapshotTests
      - name: Apply Identity, Seller, Catalog and Geography migrations
        run: dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --apply-migrations
      - name: Confirm repeated migration is harmless
        run: dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --apply-migrations
      - name: Test Identity, Seller, Catalog and Geography with real PostgreSQL
        run: dotnet test Hana.slnx --configuration Release --no-build
      - name: Verify catalog operator preview and apply CLI
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/catalog-operator-ci.json <<'JSON'
          {"categories":[{"id":"2fd59aad-5834-4717-9462-c5e520dd7a31","name":"گروه CI","slug":"ci-catalog-operator","state":"DRAFT"}],"products":[]}
          JSON
          dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --catalog-preview /tmp/catalog-operator-ci.json > /tmp/catalog-preview.log
          grep -q 'categories new=1, changed=0' /tmp/catalog-preview.log
          catalog_sha=$(grep '^Reviewed input sha256=' /tmp/catalog-preview.log | cut -d= -f2)
          catalog_db_sha=$(grep '^Reviewed DB state sha256=' /tmp/catalog-preview.log | cut -d= -f2)
          test "${#catalog_db_sha}" -eq 64
          test "$catalog_sha" = "$(sha256sum /tmp/catalog-operator-ci.json | cut -d' ' -f1)"
          # Applying without review approval must not be possible.
          if dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --catalog-apply /tmp/catalog-operator-ci.json > /tmp/catalog-unreviewed.log 2>&1; then
            echo 'Unpinned catalog apply was accepted'
            exit 1
          fi
          # File hash alone is insufficient; the DB preview must be approved.
          if dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --catalog-apply /tmp/catalog-operator-ci.json --expected-sha256 "$catalog_sha" > /tmp/catalog-missing-db-review.log 2>&1; then
            echo 'Unpinned catalog DB state was accepted'
            exit 1
          fi
          sed 's/ci-catalog-operator/ci-catalog-changed/' /tmp/catalog-operator-ci.json > /tmp/catalog-changed.json
          if dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --catalog-apply /tmp/catalog-changed.json --expected-sha256 "$catalog_sha" --expected-db-state-sha256 "$catalog_db_sha" > /tmp/catalog-mismatch.log 2>&1; then
            echo 'Changed catalog content was accepted with old review hash'
            exit 1
          fi
          grep -q 'Reviewed import SHA-256 differs from preview' /tmp/catalog-mismatch.log
          dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --catalog-apply /tmp/catalog-operator-ci.json --expected-sha256 "$catalog_sha" --expected-db-state-sha256 "$catalog_db_sha" > /tmp/catalog-applied.log
          grep -q 'Catalog APPLIED: categories new=1, changed=0; products new=0, changed=0' /tmp/catalog-applied.log
          # Exact reviewed file but changed relevant DB state: fail with no receipt.
          if dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --catalog-apply /tmp/catalog-operator-ci.json --expected-sha256 "$catalog_sha" --expected-db-state-sha256 "$catalog_db_sha" > /tmp/catalog-stale-db.log 2>&1; then
            echo 'Stale catalog preview was allowed to apply'
            exit 1
          fi
          grep -q 'Imported database state differs from preview' /tmp/catalog-stale-db.log
          dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --catalog-preview /tmp/catalog-operator-ci.json > /tmp/catalog-repeat-preview.log
          catalog_fresh_db_sha=$(grep '^Reviewed DB state sha256=' /tmp/catalog-repeat-preview.log | cut -d= -f2)
          test "$catalog_fresh_db_sha" != "$catalog_db_sha"
          dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --catalog-apply /tmp/catalog-operator-ci.json --expected-sha256 "$catalog_sha" --expected-db-state-sha256 "$catalog_fresh_db_sha" > /tmp/catalog-repeat.log
          grep -q 'Catalog APPLIED: categories new=0, changed=0; products new=0, changed=0' /tmp/catalog-repeat.log
      - name: Verify geography operator preview and apply CLI
        shell: bash
        run: |
          set -euo pipefail
          # CI-only operator-reviewed location; never a production seed.
          cat > /tmp/hana-geo-operator-ci.json <<'JSON'
          {"provinces":[{"id":"2fd59aad-5834-4717-9462-c5e520dd7a31","name":"استان آزمایشی CI","slug":"ci-reviewed-province","state":"DRAFT"}],"cities":[{"id":"40a9a026-f3f8-4366-b164-d43b52b641be","provinceId":"2fd59aad-5834-4717-9462-c5e520dd7a31","name":"شهر آزمایشی CI","slug":"ci-reviewed-city","state":"DRAFT"}]}
          JSON
          dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --geography-preview /tmp/hana-geo-operator-ci.json > /tmp/hana-geo-preview.log
          grep -q 'Geography PREVIEW ONLY: provinces new=1, changed=0; cities new=1, changed=0' /tmp/hana-geo-preview.log
          geography_sha=$(grep '^Reviewed input sha256=' /tmp/hana-geo-preview.log | cut -d= -f2)
          geography_db_sha=$(grep '^Reviewed DB state sha256=' /tmp/hana-geo-preview.log | cut -d= -f2)
          test "${#geography_db_sha}" -eq 64
          test "$geography_sha" = "$(sha256sum /tmp/hana-geo-operator-ci.json | cut -d' ' -f1)"
          if dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --geography-apply /tmp/hana-geo-operator-ci.json > /tmp/geo-unreviewed.log 2>&1; then
            echo 'Unpinned geography apply was accepted'
            exit 1
          fi
          # File hash alone is insufficient; the DB preview must be approved.
          if dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --geography-apply /tmp/hana-geo-operator-ci.json --expected-sha256 "$geography_sha" > /tmp/geo-missing-db-review.log 2>&1; then
            echo 'Unpinned geography DB state was accepted'
            exit 1
          fi
          sed 's/ci-reviewed-city/ci-changed-city/' /tmp/hana-geo-operator-ci.json > /tmp/geo-changed.json
          if dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --geography-apply /tmp/geo-changed.json --expected-sha256 "$geography_sha" --expected-db-state-sha256 "$geography_db_sha" > /tmp/geo-mismatch.log 2>&1; then
            echo 'Changed geography content was accepted with old review hash'
            exit 1
          fi
          grep -q 'Reviewed import SHA-256 differs from preview' /tmp/geo-mismatch.log
          dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --geography-apply /tmp/hana-geo-operator-ci.json --expected-sha256 "$geography_sha" --expected-db-state-sha256 "$geography_db_sha" > /tmp/hana-geo-apply.log
          grep -q 'Geography APPLIED: provinces new=1, changed=0; cities new=1, changed=0' /tmp/hana-geo-apply.log
          if dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --geography-apply /tmp/hana-geo-operator-ci.json --expected-sha256 "$geography_sha" --expected-db-state-sha256 "$geography_db_sha" > /tmp/geo-stale-db.log 2>&1; then
            echo 'Stale geography preview was allowed to apply'
            exit 1
          fi
          grep -q 'Imported database state differs from preview' /tmp/geo-stale-db.log
          dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --geography-preview /tmp/hana-geo-operator-ci.json > /tmp/geo-repeat-preview.log
          geo_fresh_db_sha=$(grep '^Reviewed DB state sha256=' /tmp/geo-repeat-preview.log | cut -d= -f2)
          test "$geo_fresh_db_sha" != "$geography_db_sha"
          dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --geography-apply /tmp/hana-geo-operator-ci.json --expected-sha256 "$geography_sha" --expected-db-state-sha256 "$geo_fresh_db_sha" > /tmp/hana-geo-repeat.log
          grep -q 'Geography APPLIED: provinces new=0, changed=0; cities new=0, changed=0' /tmp/hana-geo-repeat.log
      - name: Smoke test liveness and bootstrap endpoint
        shell: bash
        run: |
          set -euo pipefail
          ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://127.0.0.1:5184 dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile > /tmp/hana-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5184/health/live > /dev/null; then
              curl --fail --silent http://127.0.0.1:5184/api/v1/system/status | grep -q '"phase":"bootstrap"'
              curl --fail --silent http://127.0.0.1:5184/health/ready | grep -q '"ready":true'
              curl --fail --silent http://127.0.0.1:5184/api/v1/catalog/categories -o /tmp/hana-catalog-categories.json
              grep -q '"items":' /tmp/hana-catalog-categories.json
              curl --fail --silent http://127.0.0.1:5184/api/v1/catalog/products -o /tmp/hana-catalog-products.json
              grep -q '"pageSize":20' /tmp/hana-catalog-products.json
              curl --fail --silent http://127.0.0.1:5184/api/v1/geography/provinces -o /tmp/hana-geography-provinces.json
              grep -q '"items":' /tmp/hana-geography-provinces.json
              city_missing_province=$(curl --silent --output /tmp/hana-geography-invalid.json --write-out "%{http_code}" http://127.0.0.1:5184/api/v1/geography/cities)
              test "$city_missing_province" = "400"
              city_unknown=$(curl --silent --output /tmp/hana-geography-empty.json --write-out "%{http_code}" http://127.0.0.1:5184/api/v1/geography/cities/123e4567-e89b-42d3-a456-426614174000)
              test "$city_unknown" = "404"
              catalog_bad=$(curl --silent --output /tmp/hana-catalog-invalid.json --write-out "%{http_code}" 'http://127.0.0.1:5184/api/v1/catalog/products?pageSize=100')
              test "$catalog_bad" = "400"
              status_invalid=$(curl --silent --output /tmp/hana-invalid.json --write-out "%{http_code}" -H "Content-Type: application/json" -d '{"phone":"123"}' http://127.0.0.1:5184/api/v1/auth/otp/request)
              test "$status_invalid" = "400"
              status_no_provider=$(curl --silent --output /tmp/hana-no-provider.json --write-out "%{http_code}" -H "Content-Type: application/json" -d '{"phone":"09123456789"}' http://127.0.0.1:5184/api/v1/auth/otp/request)
              test "$status_no_provider" = "503"
              verify_invalid=$(curl --silent --output /tmp/hana-verify-invalid.json --write-out "%{http_code}" -H "Content-Type: application/json" -d '{"challengeId":"00000000-0000-0000-0000-000000000000","phone":"123","code":"abc"}' http://127.0.0.1:5184/api/v1/auth/otp/verify)
              test "$verify_invalid" = "400"
              verify_unavailable=$(curl --silent --output /tmp/hana-verify-unavailable.json --write-out "%{http_code}" -H "Content-Type: application/json" -d '{"challengeId":"00000000-0000-0000-0000-000000000001","phone":"09123456789","code":"123456"}' http://127.0.0.1:5184/api/v1/auth/otp/verify)
              test "$verify_unavailable" = "503"
              # No valid session is ever created by the default disabled SMS provider.
              session_no_bearer=$(curl --silent --output /tmp/hana-session-missing.json --write-out "%{http_code}" http://127.0.0.1:5184/api/v1/auth/session)
              test "$session_no_bearer" = "401"
              session_missing_db_token=$(curl --silent --output /tmp/hana-session-invalid.json --write-out "%{http_code}" -H "Authorization: Bearer hn1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" http://127.0.0.1:5184/api/v1/auth/session)
              test "$session_missing_db_token" = "401"
              logout_no_bearer=$(curl --silent --output /tmp/hana-logout-missing.json --write-out "%{http_code}" -X DELETE http://127.0.0.1:5184/api/v1/auth/session)
              test "$logout_no_bearer" = "401"
              logout_invalid=$(curl --silent --output /tmp/hana-logout-invalid.json --write-out "%{http_code}" -X DELETE -H "Authorization: Bearer hn1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" http://127.0.0.1:5184/api/v1/auth/session)
              test "$logout_invalid" = "401"
              # Seller draft endpoints never accept anonymous submissions.
              seller_get=$(curl --silent --output /tmp/hana-seller-get.json --write-out "%{http_code}" http://127.0.0.1:5184/api/v1/seller/registration)
              test "$seller_get" = "401"
              seller_put=$(curl --silent --output /tmp/hana-seller-put.json --write-out "%{http_code}" -X PUT -H "Content-Type: application/json" -d '{"storeName":"نمونه","ownerName":"مسئول","phone":"09123456789","city":"تهران","address":"نشانی","postalCode":"1234567890"}' http://127.0.0.1:5184/api/v1/seller/registration)
              test "$seller_put" = "401"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hana-api.log
          exit 1

      - name: Smoke test explicit trusted proxy handling
        shell: bash
        run: |
          set -euo pipefail

          # Production must ignore spoofed forwarding headers when the direct peer
          # is NOT in the explicit trust list.
          ASPNETCORE_ENVIRONMENT=Production \
          ASPNETCORE_URLS=http://127.0.0.1:5185 \
          ReverseProxy__Enabled=true \
          ReverseProxy__TrustedAddresses=192.0.2.10 \
          dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile > /tmp/hana-proxy-untrusted.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5185/health/live > /dev/null; then
              status=$(curl --silent --output /tmp/hana-proxy-untrusted.json --write-out "%{http_code}" \
                -H "X-Forwarded-For: 203.0.113.25" \
                -H "X-Forwarded-Proto: https" \
                -H "Authorization: Bearer hn1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" \
                http://127.0.0.1:5185/api/v1/auth/session)
              test "$status" = "503"
              break
            fi
            sleep 1
          done
          kill "$api_pid" 2>/dev/null || true
          wait "$api_pid" 2>/dev/null || true
          trap - EXIT

          # A specifically trusted loopback proxy may supply original HTTPS/IP.
          ASPNETCORE_ENVIRONMENT=Production \
          ASPNETCORE_URLS=http://127.0.0.1:5186 \
          ReverseProxy__Enabled=true \
          ReverseProxy__TrustedAddresses=127.0.0.1 \
          dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile > /tmp/hana-proxy-trusted.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5186/health/live > /dev/null; then
              status=$(curl --silent --output /tmp/hana-proxy-trusted.json --write-out "%{http_code}" \
                -H "X-Forwarded-For: 203.0.113.25" \
                -H "X-Forwarded-Proto: https" \
                -H "Authorization: Bearer hn1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" \
                http://127.0.0.1:5186/api/v1/auth/session)
              test "$status" = "401"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hana-proxy-trusted.log
          exit 1

      - name: Reject unsafe or incomplete forwarded-header configuration
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ASPNETCORE_ENVIRONMENT=Production \
          ASPNETCORE_URLS=http://127.0.0.1:5187 \
          ReverseProxy__Enabled=true \
          dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile > /tmp/hana-proxy-invalid.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "ReverseProxy:TrustedAddresses" /tmp/hana-proxy-invalid.log

          set +e
          ASPNETCORE_FORWARDEDHEADERS_ENABLED=true \
          ASPNETCORE_ENVIRONMENT=Production \
          ASPNETCORE_URLS=http://127.0.0.1:5188 \
          dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile > /tmp/hana-proxy-unsafe-switch.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "ASPNETCORE_FORWARDEDHEADERS_ENABLED=true is not allowed" /tmp/hana-proxy-unsafe-switch.log

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck web
        run: npm run web:typecheck
      - name: Build web
        run: npm run web:build
      - name: Smoke test Figma routes and exported logo
        shell: bash
        run: |
          set -euo pipefail
          npm run start --workspace @hana/web-marketplace > /tmp/hana-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/auth -o /tmp/hana-auth.html; then
              curl --fail --silent http://127.0.0.1:3000/seller/register -o /tmp/hana-seller.html
              curl --fail --silent http://127.0.0.1:3000/hana-logo.png -o /tmp/hana-logo.png
              grep -q 'ورود به حنا' /tmp/hana-auth.html
              grep -q 'ثبت‌نام فروشگاه در حنا' /tmp/hana-seller.html
              # No input is editable until the authenticated draft GET and
              # revision have both been loaded by the client.
              grep -q 'disabled=""' /tmp/hana-seller.html
              test -s /tmp/hana-logo.png
              # Route mutations need an exact same-origin Origin header.
              auth_proxy_status=$(curl --silent --output /tmp/hana-auth-proxy.json --write-out "%{http_code}" -H "Content-Type: application/json" -H "Origin: http://127.0.0.1:3000" -d '{"phone":"09123456789"}' http://127.0.0.1:3000/api/auth/otp/request)
              echo "CI WEB auth_proxy_status=$auth_proxy_status"
              test "$auth_proxy_status" = "503"
              auth_csrf=$(curl --silent --output /tmp/hana-auth-csrf.json --write-out "%{http_code}" -H "Content-Type: application/json" -H "Origin: https://malicious.test" -d '{"phone":"09123456789"}' http://127.0.0.1:3000/api/auth/otp/request)
              echo "CI WEB auth_csrf=$auth_csrf"
              test "$auth_csrf" = "403"
              verify_no_provider=$(curl --silent --output /tmp/hana-verify-no-provider.json --write-out "%{http_code}" -H "Content-Type: application/json" -H "Origin: http://127.0.0.1:3000" -d '{"phone":"09123456789","code":"123456","challengeId":"6b2bc828-cf5d-4af7-a026-a653739d8509"}' http://127.0.0.1:3000/api/auth/otp/verify)
              echo "CI WEB verify_no_provider=$verify_no_provider"
              test "$verify_no_provider" = "503"
              session_no_cookie=$(curl --silent --output /tmp/hana-web-session.json --write-out "%{http_code}" http://127.0.0.1:3000/api/auth/session)
              echo "CI WEB session_no_cookie=$session_no_cookie"
              test "$session_no_cookie" = "401"
              logout_wrong_origin=$(curl --silent --output /tmp/hana-web-logout.json --write-out "%{http_code}" -X DELETE -H "Origin: https://malicious.test" http://127.0.0.1:3000/api/auth/session)
              echo "CI WEB logout_wrong_origin=$logout_wrong_origin"
              test "$logout_wrong_origin" = "403"
              seller_csrf=$(curl --silent --output /tmp/hana-seller-csrf.json --write-out "%{http_code}" -X PUT -H "Content-Type: application/json" -H "Origin: https://malicious.test" -d '{}' http://127.0.0.1:3000/api/seller/registration)
              test "$seller_csrf" = "403"
              seller_anonymous=$(curl --silent --output /tmp/hana-seller-anonymous.json --write-out "%{http_code}" -X PUT -H "Content-Type: application/json" -H "Origin: http://127.0.0.1:3000" -d '{}' http://127.0.0.1:3000/api/seller/registration)
              test "$seller_anonymous" = "401"
              seller_anonymous_get=$(curl --silent --output /tmp/hana-seller-anonymous-get.json --write-out "%{http_code}" http://127.0.0.1:3000/api/seller/registration)
              test "$seller_anonymous_get" = "401"
              # Without the required HTTPS upstream configuration, public
              # catalog gateway must fail closed, not show an empty catalog.
              for route in categories products products/123e4567-e89b-42d3-a456-426614174000; do
                result=$(curl --silent --output /tmp/hana-catalog-web.json --write-out "%{http_code}" "http://127.0.0.1:3000/api/catalog/$route")
                test "$result" = "503"
              done
              catalog_invalid=$(curl --silent --output /tmp/hana-catalog-invalid-web.json --write-out "%{http_code}" 'http://127.0.0.1:3000/api/catalog/products?pageSize=51')
              test "$catalog_invalid" = "400"
              # No upstream config cannot be mistaken for an empty city list.
              for route in provinces "cities?provinceId=123e4567-e89b-42d3-a456-426614174000" cities/123e4567-e89b-42d3-a456-426614174000; do
                status=$(curl --silent --output /tmp/hana-geo-web.json --write-out "%{http_code}" "http://127.0.0.1:3000/api/geography/$route")
                test "$status" = "503"
              done
              geo_invalid=$(curl --silent --output /tmp/hana-geo-invalid-web.json --write-out "%{http_code}" http://127.0.0.1:3000/api/geography/cities)
              test "$geo_invalid" = "400"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hana-web.log
          exit 1
      - name: Test isolated web cookie gateway (CI-only mock upstream)
        run: node tests/web-auth-gateway-smoke.mjs
      - name: Verify web and Expo OTP resend recovery (CI-only transport)
        run: node --experimental-strip-types --test tests/otp-resend-smoke.mjs
      - name: Verify seller return URL policy and safe draft hydration
        run: node --experimental-strip-types --test tests/web-seller-return-smoke.mjs
      - name: Test real seller form conflict reconciliation policy
        run: node --experimental-strip-types --test tests/web-seller-conflict-smoke.mjs
      - name: Test safe three-way seller field merge after concurrent edits
        run: node --experimental-strip-types --test tests/web-seller-field-merge-smoke.mjs
      - name: Test seller input error recovery and unsaved draft guard
        run: node --experimental-strip-types --test tests/web-seller-edit-safety-smoke.mjs
      - name: Test optional seller city reference via genuine public geography gateway
        run: node --experimental-strip-types --test tests/web-seller-location-reference-smoke.mjs
      - name: Verify public geography Next gateway over isolated CI HTTPS
        run: node tests/web-geography-gateway-smoke.mjs
      - name: Install CI-only Chromium for actual frontend interactions
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Browser test approved buyer login and seller form across two tabs
        run: node tests/web-frontend-browser-smoke.mjs
      - name: Browser test buyer OTP recovery at mobile viewport
        run: node tests/web-auth-recovery-browser-smoke.mjs

  mobile:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install monorepo dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo compatibility
        run: npx expo install --check
        working-directory: apps/mobile-consumer
      - name: Typecheck consumer app
        run: npm run mobile:typecheck
      - name: Test mobile OTP and SecureStore session semantics (CI-only mocked API/store)
        run: node --experimental-strip-types --test tests/mobile-auth-smoke.mjs
      - name: Test Expo OTP field feedback and six-digit submission guard
        run: node --experimental-strip-types --test tests/mobile-otp-entry-smoke.mjs
      - name: Test Expo foreground session revalidation and SecureStore fail closed
        run: node --experimental-strip-types --test tests/mobile-session-resume-smoke.mjs
      - name: Test public mobile buyer catalog client (CI-only mocked transport)
        run: node --experimental-strip-types --test tests/mobile-catalog-smoke.mjs
      - name: Test public Expo geography client (CI-only mocked transport)
        run: node --experimental-strip-types --test tests/mobile-geography-smoke.mjs
      - name: Bundle consumer app for Android
        run: npm run mobile:export:android

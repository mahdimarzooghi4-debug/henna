name: Bootstrap checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Ephemeral CI-only credential. Never reuse in any deployment.
      ConnectionStrings__IdentityDb: Host=localhost;Port=5432;Database=hana_ci;Username=hana_ci;Password=hana_ci_only
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hana_ci
          POSTGRES_USER: hana_ci
          POSTGRES_PASSWORD: hana_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hana_ci -d hana_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore .NET solution
        run: dotnet restore Hana.slnx
      - name: Build .NET solution
        run: dotnet build Hana.slnx --configuration Release --no-restore
      - name: Apply identity migrations
        run: dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --apply-migrations
      - name: Confirm repeated migration is harmless
        run: dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile -- --apply-migrations
      - name: Test identity domain, OTP issuance/concurrency and PostgreSQL schema
        run: dotnet test Hana.slnx --configuration Release --no-build
      - name: Smoke test liveness and bootstrap endpoint
        shell: bash
        run: |
          set -euo pipefail
          ASPNETCORE_URLS=http://127.0.0.1:5184 dotnet run --project apps/api/Hana.Api/Hana.Api.csproj --configuration Release --no-build --no-launch-profile > /tmp/hana-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5184/health/live > /dev/null; then
              curl --fail --silent http://127.0.0.1:5184/api/v1/system/status | grep -q '"phase":"bootstrap"'
              curl --fail --silent http://127.0.0.1:5184/health/ready | grep -q '"ready":true'
              status_invalid=$(curl --silent --output /tmp/hana-invalid.json --write-out "%{http_code}" -H "Content-Type: application/json" -d '{"phone":"123"}' http://127.0.0.1:5184/api/v1/auth/otp/request)
              test "$status_invalid" = "400"
              status_no_provider=$(curl --silent --output /tmp/hana-no-provider.json --write-out "%{http_code}" -H "Content-Type: application/json" -d '{"phone":"09123456789"}' http://127.0.0.1:5184/api/v1/auth/otp/request)
              test "$status_no_provider" = "503"
              verify_invalid=$(curl --silent --output /tmp/hana-verify-invalid.json --write-out "%{http_code}" -H "Content-Type: application/json" -d '{"challengeId":"00000000-0000-0000-0000-000000000000","phone":"123","code":"abc"}' http://127.0.0.1:5184/api/v1/auth/otp/verify)
              test "$verify_invalid" = "400"
              verify_unavailable=$(curl --silent --output /tmp/hana-verify-unavailable.json --write-out "%{http_code}" -H "Content-Type: application/json" -d '{"challengeId":"00000000-0000-0000-0000-000000000001","phone":"09123456789","code":"123456"}' http://127.0.0.1:5184/api/v1/auth/otp/verify)
              test "$verify_unavailable" = "503"
              # No valid session is ever created by the default disabled SMS provider.
              session_no_bearer=$(curl --silent --output /tmp/hana-session-missing.json --write-out "%{http_code}" http://127.0.0.1:5184/api/v1/auth/session)
              test "$session_no_bearer" = "401"
              session_missing_db_token=$(curl --silent --output /tmp/hana-session-invalid.json --write-out "%{http_code}" -H "Authorization: Bearer hn1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" http://127.0.0.1:5184/api/v1/auth/session)
              test "$session_missing_db_token" = "401"
              logout_no_bearer=$(curl --silent --output /tmp/hana-logout-missing.json --write-out "%{http_code}" -X DELETE http://127.0.0.1:5184/api/v1/auth/session)
              test "$logout_no_bearer" = "401"
              logout_invalid=$(curl --silent --output /tmp/hana-logout-invalid.json --write-out "%{http_code}" -X DELETE -H "Authorization: Bearer hn1_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" http://127.0.0.1:5184/api/v1/auth/session)
              test "$logout_invalid" = "401"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hana-api.log
          exit 1

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck web
        run: npm run web:typecheck
      - name: Build web
        run: npm run web:build
      - name: Smoke test Figma routes and exported logo
        shell: bash
        run: |
          set -euo pipefail
          npm run start --workspace @hana/web-marketplace > /tmp/hana-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/auth -o /tmp/hana-auth.html; then
              curl --fail --silent http://127.0.0.1:3000/seller/register -o /tmp/hana-seller.html
              curl --fail --silent http://127.0.0.1:3000/hana-logo.png -o /tmp/hana-logo.png
              grep -q 'ورود به حنا' /tmp/hana-auth.html
              grep -q 'ثبت‌نام فروشگاه در حنا' /tmp/hana-seller.html
              test -s /tmp/hana-logo.png
              auth_proxy_status=$(curl --silent --output /tmp/hana-auth-proxy.json --write-out "%{http_code}" -H "Content-Type: application/json" -d '{"phone":"09123456789"}' http://127.0.0.1:3000/api/auth/otp/request)
              test "$auth_proxy_status" = "503"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hana-web.log
          exit 1

  mobile:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install monorepo dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo compatibility
        run: npx expo install --check
        working-directory: apps/mobile-consumer
      - name: Typecheck consumer app
        run: npm run mobile:typecheck
      - name: Bundle consumer app for Android
        run: npm run mobile:export:android
